name: Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ vars.VITE_SUPABASE_URL != '' && vars.VITE_SUPABASE_PUBLISHABLE_KEY != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install package manager
        run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Verify account changes and stale responses
        run: pnpm test:session
      - name: Verify registration and existing-account email codes
        run: pnpm test:confirmation
      - name: Verify password recovery and code cooldown
        run: pnpm test:recovery
      - name: Verify filtered results export
        run: pnpm test:results
      - name: Verify editor autosave and recovery
        run: pnpm test:drafts
      - name: Verify database permissions and scoring
        run: pnpm test:db
      - name: Verify official rules and preservation of the previous edition
        run: pnpm test:rules
      - name: Verify credential handling for the forum access check
        run: pnpm test:forum-access
      - name: Verify law import, freshness and bookmark synchronization identities
        run: pnpm test:laws && pnpm test:law-identity
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: pnpm build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_DISCORD_ENABLED: ${{ vars.VITE_DISCORD_ENABLED }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
