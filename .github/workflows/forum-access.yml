name: Check authorized forum access
on:
  workflow_dispatch:
    inputs:
      user_agent:
        description: 'Optional User-Agent of the browser session (not a credential)'
        required: false
        type: string
      source_urls:
        description: 'Official document or section URLs separated by spaces; empty uses the two initial sources'
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install package manager
        run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:forum-access
      - name: Verify access without printing credentials or page contents
        env:
          FORUM_COOKIE: ${{ secrets.FORUM_COOKIE }}
          FORUM_USER_AGENT: ${{ inputs.user_agent || secrets.FORUM_USER_AGENT }}
        run: node scripts/check-forum-access.mjs
      - name: Read only official message bodies and section links
        env:
          FORUM_COOKIE: ${{ secrets.FORUM_COOKIE }}
          FORUM_USER_AGENT: ${{ inputs.user_agent || secrets.FORUM_USER_AGENT }}
          FORUM_SOURCE_URLS: ${{ inputs.source_urls }}
        run: node scripts/collect-forum-sources.mjs
      - name: Save official source bodies for importer preparation
        uses: actions/upload-artifact@v4
        with:
          name: forum-source-bodies
          path: /tmp/usb-forum-sources/sources.json
          retention-days: 3
      - name: Save access status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forum-access-status
          path: /tmp/usb-forum-access.json
          if-no-files-found: ignore
          retention-days: 3
