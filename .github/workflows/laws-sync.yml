name: Update official laws
on:
  schedule:
    - cron: '27 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  group: official-rules-sync
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install package manager
        run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:laws
      - run: pnpm test:law-identity
      - name: Fetch and validate all eight official documents
        env:
          FORUM_COOKIE: ${{ secrets.FORUM_COOKIE }}
          FORUM_USER_AGENT: ${{ secrets.FORUM_USER_AGENT }}
        run: pnpm sync:laws
      - name: Keep bookmarks valid for the imported articles
        run: node scripts/sync-law-references.mjs
      - name: Save verified documents
        run: |
          git add public/laws lib/law-documents.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update official law documents'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Publish updated laws
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
